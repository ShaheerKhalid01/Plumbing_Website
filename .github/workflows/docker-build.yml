name: Docker Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build image (no push)
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: mckinney-plumbing:ci
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ secrets.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_PHONE=${{ secrets.NEXT_PUBLIC_PHONE }}
            NEXT_PUBLIC_PHONE_DISPLAY=${{ secrets.NEXT_PUBLIC_PHONE_DISPLAY }}
            NEXT_PUBLIC_BUSINESS_NAME=${{ secrets.NEXT_PUBLIC_BUSINESS_NAME }}
            NEXT_PUBLIC_CITY=${{ secrets.NEXT_PUBLIC_CITY }}
            NEXT_PUBLIC_STATE=${{ secrets.NEXT_PUBLIC_STATE }}
            NEXT_PUBLIC_GOOGLE_MAPS_URL=${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_URL }}
            NEXT_PUBLIC_GOOGLE_MAPS_EMBED=${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_EMBED }}
            MONGODB_URI=${{ secrets.MONGODB_URI }}
            ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}
